<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Abdessalem Saadaoui</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="This page does not exist. Return to the homepage or open the analyst workspace." />
    <meta name="theme-color" content="#0d0f11" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!--
      Served by the 404 rule in vercel.json, with a real 404 status, for any
      URL that matches no file and no route. It is deliberately standalone:
      Create React App only templates index.html, and a not-found page that
      waits on the app bundle is a not-found page that renders blank if the
      bundle is the thing that is missing.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: linear-gradient(140deg, #0b1016, #132430);
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 34rem; }
      .code {
        font-size: .8rem; font-weight: 700; letter-spacing: .35em;
        color: #14b8a6; margin: 0 0 1rem;
      }
      h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0 0 .85rem; line-height: 1.2; }
      p { margin: 0 auto 2rem; color: #94a3b8; line-height: 1.65; max-width: 28rem; }
      .actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block; padding: .8rem 1.5rem; border-radius: 999px;
        text-decoration: none; font-weight: 600; font-size: .95rem;
        border: 1px solid #14b8a6; transition: background-color .18s, color .18s;
      }
      .primary { background: #14b8a6; color: #06231f; }
      .primary:hover { background: #0f9c8d; }
      .secondary { color: #5eead4; }
      .secondary:hover { background: rgba(20, 184, 166, .12); }
      a:focus-visible { outline: 2px solid #5eead4; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">ERROR 404</p>
      <h1>This page doesn’t exist</h1>
      <p>
        The address may be mistyped, or the page may have moved. Everything on
        the site is reachable from the homepage.
      </p>
      <div class="actions">
        <a class="primary" href="/">Back to homepage</a>
        <a class="secondary" href="/fa/">Analyst workspace</a>
      </div>
    </main>
  </body>
</html>
